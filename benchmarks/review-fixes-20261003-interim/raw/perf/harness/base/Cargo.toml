[package]
name = "femtovg-review-fixes-base"
version = "0.1.0"
edition = "2021"

[workspace]

[[bin]]
name = "probe-base"
path = "../../harness-src/main.rs"

[[bin]]
name = "cold-base"
path = "../../harness-src/cold.rs"

[[bin]]
name = "generic-base"
path = "../../harness-src/generic.rs"

[dependencies]
femtovg = { path = "/private/tmp/femtovg-review-fixes-perf/source/base", default-features = false }
swash = "=0.2.10"

[features]
swash_only = ["femtovg/swash"]
default_swash = ["femtovg/default", "femtovg/swash"]
default_no_swash = ["femtovg/default"]

[profile.release]
opt-level = 3
debug = false
lto = false
codegen-units = 16
incremental = false
panic = "unwind"
